name: ci
# Automatic push/pull_request triggers are disabled to avoid consuming
# GitHub Actions minutes. Run on demand from the Actions tab, or restore the
# triggers below to re-enable CI:
#   on:
#     push:
#     pull_request:
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: hook script tests
        run: |
          bash hooks/snapshot-transcript_test.sh
          bash hooks/record-repo_test.sh
