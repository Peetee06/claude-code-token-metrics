name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: hook script test
        run: bash hooks/snapshot-transcript_test.sh
